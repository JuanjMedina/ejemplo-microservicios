server:
  port: 8080

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
    ip-address: ${HOST_IP:192.168.2.6}
    hostname: localhost


spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: usuario-service
          uri: lb://usuario-service
          predicates:
            - Path=/users/**
        - id: moto-service
          uri: lb://moto-service
          predicates:
            - Path=/motorbikes/**
        - id: carro-service
          uri: lb://carro-service
          predicates:
            - Path=/cars/**
            - Path=/cars