server:
  port: 8080


logging:
  level:
    root: info
    org.springframework.cloud.gateway: trace
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: info


spring:
  cloud:
    gateway:
      routes:
        - id: usuario-service
          uri: lb://usuario-service
          predicates:
            - Path=/users/**
        - id: moto-service
          uri: lb://moto-service
          predicates:
            - Path=/motorbikes/**
        - id: carro-service
          uri: lb://carro-service
          predicates:
            - Path=/cars/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
    ip-address: ${HOST_IP:192.168.2.6}
    hostname: ${HOST_IP:192.168.2.6}
