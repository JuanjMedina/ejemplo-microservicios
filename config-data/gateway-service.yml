server:
  port: 8080

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
    hostname: localhost


spring:
  cloud: 
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: usuario-service
          uri: lb://usuario-service
          predicates:
            - Path=/usuarios/**
        - id: moto-service
          uri: lb://moto-service
          predicates:
            - Path=/motos/**
        - id: cliente-service
          uri: lb://cliente-service
          predicates:
            - Path=/clientes/**